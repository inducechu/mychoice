server:
  port: 8082

spring:
  application:
    name: user-service

  config:
    import:
      - "optional:classpath:eureka-client.yaml"
      - "optional:classpath:spring-doc.yaml"
      - "optional:classpath:kafka-consumer.yaml"

  datasource:
    url: jdbc:postgresql://postgres:5432/mychoice_user
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
  grpc:
    server:
      port: 9092
    client:
      channels:
        university-service:
          address: "dns:///university-service:9093"
          negotiation-type: plaintext
