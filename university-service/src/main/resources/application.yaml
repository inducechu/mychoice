server:
  port: 8083
spring:
  application:
    name: university-service
  config:
    import:
      - "optional:classpath:spring-doc.yaml"
      - "optional:classpath:grpc-client.yaml"
      - "optional:classpath:eureka-client.yaml"
  datasource:
    url: jdbc:postgresql://postgres:5432/mychoice_university
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
