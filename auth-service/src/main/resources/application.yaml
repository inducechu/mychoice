server:
  port: 8081
spring:
  application:
    name: auth-service
  config:
    import:
      - "optional:classpath:eureka-client.yaml"
      - "optional:classpath:spring-doc.yaml"
      - "optional:classpath:kafka-producer.yaml"
  datasource:
    url: jdbc:postgresql://postgres:5432/mychoice_auth
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000
outbox:
  publisher:
    batch-size: 50
    fixed-delay-ms: 1000
    max-attempts: 10
